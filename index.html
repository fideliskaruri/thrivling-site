<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8cc8ee" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/brand/icon.png" />
    <meta name="description" content="Progress that feels alive. Grow what nourishes you. Outgrow what doesn't." />
    <title>Thrivling | Progress that feels alive</title>
    <style>
      /* Shown before any script runs, and until the first tree stage is ready to draw. */
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: linear-gradient(#8cc8ee, #b7dcf2 62%, #e3f0f7); font-family: system-ui, sans-serif; color: #1f3340; transition: opacity .6s ease, visibility .6s; }
      .is-loaded #boot { opacity: 0; visibility: hidden; }
      #boot .hill { position: absolute; left: -35%; width: 170%; height: 30%; bottom: -20%; border-radius: 50% 50% 0 0; background: #8fb978; }
      #boot figure { margin: 0; display: grid; justify-items: center; gap: 18px; transform: translateY(-4vh); }
      #boot svg { width: 120px; height: 140px; overflow: visible; }
      #boot .stem { fill: none; stroke: #7a5a43; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: boot-grow 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
      #boot .leaf { fill: #4f9a5a; transform-box: fill-box; transform-origin: 0% 100%; transform: scale(0); animation: boot-leaf .7s cubic-bezier(.3,1.4,.4,1) forwards; }
      #boot .leaf.r { transform-origin: 100% 100%; fill: #6bb36f; }
      #boot .l1 { animation-delay: .55s; } #boot .l2 { animation-delay: .8s; } #boot .l3 { animation-delay: 1.05s; } #boot .l4 { animation-delay: 1.25s; }
      #boot .ground { fill: rgba(31,51,64,.1); }
      #boot figcaption { font-size: 15px; letter-spacing: .01em; opacity: .75; animation: boot-breathe 2.4s ease-in-out infinite; }
      #boot .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(31,51,64,.12); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: #4f9a5a; border-radius: inherit; transition: width .3s ease; }
      #boot .pct { font-variant-numeric: tabular-nums; }
      #boot .tree { transform-origin: 60px 132px; animation: boot-sway 3.2s ease-in-out 1.6s infinite; }
      @keyframes boot-grow { to { stroke-dashoffset: 0; } }
      @keyframes boot-leaf { to { transform: scale(1); } }
      @keyframes boot-breathe { 50% { opacity: .45; } }
      @keyframes boot-sway { 50% { transform: rotate(2.5deg); } }
      @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; stroke-dashoffset: 0 !important; transform: none !important; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Thrivling">
      <div class="hill"></div>
      <figure>
        <svg viewBox="0 0 120 140" aria-hidden="true">
          <ellipse class="ground" cx="60" cy="133" rx="34" ry="5" />
          <g class="tree">
            <path class="stem" d="M60 132 C 60 110, 56 92, 62 70 C 66 56, 60 44, 60 30" />
            <path class="leaf l1" d="M61 96 C 44 98, 36 86, 34 76 C 48 74, 58 82, 61 96 Z" />
            <path class="leaf r l2" d="M62 80 C 78 82, 88 72, 90 60 C 76 58, 64 66, 62 80 Z" />
            <path class="leaf l3" d="M61 58 C 46 58, 40 46, 40 38 C 52 37, 60 46, 61 58 Z" />
            <path class="leaf r l4" d="M60 32 C 66 20, 76 16, 84 16 C 82 28, 72 34, 60 32 Z" />
          </g>
        </svg>
        <figcaption>Growing your grove <span class="pct">0%</span></figcaption>
        <div class="bar" aria-hidden="true"><i></i></div>
      </figure>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
