<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8cc8ee" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/brand/icon.png" />
    <meta name="description" content="Progress that feels alive. Grow what nourishes you. Outgrow what doesn't." />
    <title>Thrivling | Progress that feels alive</title>
    <link rel="canonical" href="https://fideliskaruri.github.io/thrivling-site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thrivling" />
    <meta property="og:title" content="Thrivling | Progress that feels alive" />
    <meta property="og:description" content="Grow what nourishes you. Outgrow what doesn't. A private habit tracker where every goal is a tree." />
    <meta property="og:url" content="https://fideliskaruri.github.io/thrivling-site/" />
    <meta property="og:image" content="https://fideliskaruri.github.io/thrivling-site/assets/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A painted grove of Thrivling trees on a grassy hill" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Shown before any script runs, and until every tree image is loaded (see TreeScene). */
      /* Shown before any script runs, and until every tree image is loaded (see TreeScene): the app icon, ringed by
         leaves that grow in one by one as the page loads, and the wordmark. */
      @font-face { font-family: Urbanist; src: url("/src/assets/fonts/Urbanist-200.ttf") format("truetype"); font-weight: 200; font-display: block; }
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #fbf8f1; color: #1f3340; font-family: system-ui, sans-serif; transition: opacity .6s ease, visibility .6s; --p: 0; }
      .is-loaded #boot { opacity: 0; visibility: hidden; }
      #boot .col { display: grid; justify-items: center; gap: 30px; transform: translateY(-3vh); }
      #boot .wreath { position: relative; width: 220px; height: 220px; }
      #boot .wreath img { position: absolute; inset: 55px; width: 110px; height: 110px; border-radius: 50%; box-shadow: 0 16px 30px -14px rgb(16 34 49 / .45); }
      #boot .wreath i { position: absolute; left: 50%; top: 50%; width: 22px; height: 12px; margin: -6px 0 0 -11px; border-radius: 100% 0; background: #5aa265;
        transform: rotate(var(--a)) translateX(92px) rotate(90deg) scale(clamp(0, calc(var(--p) * 24 - var(--i)), 1)); transition: transform .5s cubic-bezier(.22, 1, .36, 1); }
      #boot .wreath i:nth-child(odd) { background: #7cbf74; }
      #boot .word { font: 200 52px/1 Urbanist, system-ui, sans-serif; letter-spacing: -.06em; }
      @media (max-width: 400px) { #boot .wreath { width: 180px; height: 180px; } #boot .wreath img { inset: 45px; width: 90px; height: 90px; } #boot .wreath i { transform: rotate(var(--a)) translateX(75px) rotate(90deg) scale(clamp(0, calc(var(--p) * 24 - var(--i)), 1)); } #boot .word { font-size: 44px; } }
      @media (prefers-reduced-motion: reduce) { #boot .wreath i { transition: none; } }    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-label="Loading Thrivling" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="col">
        <div class="wreath" aria-hidden="true">
          <img src="/assets/brand/icon.png" alt="" width="110" height="110" />
          <i style="--i:0;--a:-90deg"></i>
          <i style="--i:1;--a:-75deg"></i>
          <i style="--i:2;--a:-60deg"></i>
          <i style="--i:3;--a:-45deg"></i>
          <i style="--i:4;--a:-30deg"></i>
          <i style="--i:5;--a:-15deg"></i>
          <i style="--i:6;--a:0deg"></i>
          <i style="--i:7;--a:15deg"></i>
          <i style="--i:8;--a:30deg"></i>
          <i style="--i:9;--a:45deg"></i>
          <i style="--i:10;--a:60deg"></i>
          <i style="--i:11;--a:75deg"></i>
          <i style="--i:12;--a:90deg"></i>
          <i style="--i:13;--a:105deg"></i>
          <i style="--i:14;--a:120deg"></i>
          <i style="--i:15;--a:135deg"></i>
          <i style="--i:16;--a:150deg"></i>
          <i style="--i:17;--a:165deg"></i>
          <i style="--i:18;--a:180deg"></i>
          <i style="--i:19;--a:195deg"></i>
          <i style="--i:20;--a:210deg"></i>
          <i style="--i:21;--a:225deg"></i>
          <i style="--i:22;--a:240deg"></i>
          <i style="--i:23;--a:255deg"></i>
        </div>
        <div class="word" aria-hidden="true">Thrivling</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
