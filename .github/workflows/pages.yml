name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
      - real-tree
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build
      # The real-tree variant is built from its branch into /real/, so both versions are live side by side.
      - name: Check out the real-tree variant
        uses: actions/checkout@v4
        with:
          ref: real-tree
          path: real-tree
        continue-on-error: true
      - name: Build the real-tree variant
        if: hashFiles('real-tree/package.json') != ''
        working-directory: real-tree
        env:
          SITE_BASE: /thrivling-site/real/
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../dist/real
          cp -r dist/. ../dist/real/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
